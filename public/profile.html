<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryoLedger - Profile & Settings</title>

    <meta name="description" content="CryoLedger provides end-to-end supply chain assurance with GPS verification and cryptographic checks.">
    <meta property="og:title" content="CryoLedger - Supply Chain Integrity">
    <meta property="og:description" content="Secure Product Authentication System with Geo-Verification.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cryoledger-backend.onrender.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CryoLedger">
    <meta name="twitter:description" content="Protecting trust through location-intelligent product authentication.">

<link rel="canonical" href="https://cryoledger-backend.onrender.com/profile.html">

    <link rel="stylesheet" href="styles.css">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/icons/icon.svg">
</head>

<body>
  <!-- CryoLedger Global Splash Screen -->
  <div id="cryo-global-splash" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0B1120; z-index:9999999; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.8s ease, visibility 0.8s ease;">
    <style>
      @keyframes cryoSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .cryo-spinner { width: 48px; height: 48px; border: 4px solid rgba(16,185,129,0.2); border-left-color: #10b981; border-radius: 50%; animation: cryoSpin 1s linear infinite; margin-top: 2rem; margin-bottom: 2rem; }
      .cryo-logo-text { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, #fff 30%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Outfit', sans-serif; display:flex; align-items:center; gap:0.5rem;}
      @media(max-width: 600px) {
         .cryo-logo-text { font-size: 2.2rem; }
         .cryo-splash-msg { font-size: 0.95rem; text-align: center; padding: 0 1rem; }
      }
    </style>
    <div class="cryo-logo-text">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      CryoLedger
    </div>
    <div class="cryo-spinner"></div>
    <div class="cryo-splash-msg" style="color: #94a3b8; font-family: 'Inter', sans-serif; font-weight: 500;">Please wait while the application is loading...</div>
  </div>
  <script>
    (function(){
      let isReady = false;
      let isWindowLoaded = false;
      
      const checkReady = () => {
        if(isReady && isWindowLoaded) {
          const splash = document.getElementById('cryo-global-splash');
          if(splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => splash.remove(), 800);
          }
        }
      };

      window.addEventListener('load', () => {
        isWindowLoaded = true;
        checkReady();
      });

      const pingHealth = () => {
        fetch('/api/health')
          .then(res => {
            if(res.ok) {
              isReady = true;
              checkReady();
            } else {
              setTimeout(pingHealth, 1000);
            }
          })
          .catch(() => {
            setTimeout(pingHealth, 1000);
          });
      };
      
      pingHealth();
      
      // Complete fallback in case there is no connection for 30s
      setTimeout(() => {
         if(!isReady) {
            isReady = true;
            checkReady();
         }
      }, 30000);
    })();
  </script>


    <!-- Header is generated dynamically by utils.js -->

    <div class="container" style="max-width: 600px; padding: 2rem 1rem;">
        <div class="hero" style="text-align: center; margin-bottom: 2rem;">
            <h1>Profile & Settings</h1>
            <p>Update your contact details and change your account security settings.</p>
        </div>

        <!-- Alert Container -->
        <div id="alert-container"></div>

        <!-- Profile Information Section -->
        <div class="card" style="margin-bottom: 2rem; padding: 2rem;">
            <h3
                style="color: var(--color-primary); margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.5rem;">
                🕵️ Personal Details</h3>
            <form id="profile-info-form">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="color: var(--color-secondary); font-size: 0.85rem;">Username</label>
                    <input type="text" id="profile-username" readonly disabled
                        style="width: 100%; padding: 0.6rem 0.8rem; background-color: rgba(255,255,255,0.02); border: 1px solid var(--card-border); color: var(--color-secondary); border-radius: var(--radius-sm); cursor: not-allowed;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="color: var(--color-secondary); font-size: 0.85rem;">System Role</label>
                    <input type="text" id="profile-role" readonly disabled
                        style="width: 100%; padding: 0.6rem 0.8rem; background-color: rgba(255,255,255,0.02); border: 1px solid var(--card-border); color: var(--color-secondary); border-radius: var(--radius-sm); cursor: not-allowed; text-transform: uppercase;">
                </div>
                                <div class="form-group" style="margin-bottom: 1.5rem; text-align: center;">
                    <img id="profile-photo-preview" src="assets/default-avatar.png" alt="Profile" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 1rem; background-color: var(--bg-tertiary);">
                    <div>
                        <label style="color: var(--color-secondary); font-size: 0.85rem; text-align: left; display: block;">Avatar Image URL</label>
                        <input type="text" id="profile-photo" placeholder="https://..." style="width: 100%; padding: 0.6rem 0.8rem; background-color: var(--bg-tertiary); border: 1px solid var(--card-border); color: var(--color-primary); border-radius: var(--radius-sm);">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label style="color: var(--color-secondary); font-size: 0.85rem;">Email Address</label>
                    <input type="email" id="profile-email" placeholder="e.g. yourname@example.com"
                        style="width: 100%; padding: 0.6rem 0.8rem; background-color: var(--bg-tertiary); border: 1px solid var(--card-border); color: var(--color-primary); border-radius: var(--radius-sm);">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Profile Details</button>
            </form>
        </div>

        <!-- Password Change Section -->
        <div class="card" style="padding: 2rem;">
            <h3
                style="color: var(--color-primary); margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.5rem;">
                🔒 Security Credentials</h3>
            <form id="profile-password-form">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="color: var(--color-secondary); font-size: 0.85rem;">Current Password</label>
                    <input type="password" id="current-password" placeholder="Enter current password" required
                        style="width: 100%; padding: 0.6rem 0.8rem; background-color: var(--bg-tertiary); border: 1px solid var(--card-border); color: var(--color-primary); border-radius: var(--radius-sm);">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="color: var(--color-secondary); font-size: 0.85rem;">New Password</label>
                    <input type="password" id="new-password" placeholder="Enter new password" required
                        style="width: 100%; padding: 0.6rem 0.8rem; background-color: var(--bg-tertiary); border: 1px solid var(--card-border); color: var(--color-primary); border-radius: var(--radius-sm);">
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label style="color: var(--color-secondary); font-size: 0.85rem;">Confirm New Password</label>
                    <input type="password" id="confirm-password" placeholder="Retype new password" required
                        style="width: 100%; padding: 0.6rem 0.8rem; background-color: var(--bg-tertiary); border: 1px solid var(--card-border); color: var(--color-primary); border-radius: var(--radius-sm);">
                </div>
                <button type="submit" class="btn btn-secondary" style="width: 100%;">Update Security
                    Credentials</button>
            </form>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/profile.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
</body>

</html>
