<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryoLedger - Admin Panel</title>

    <meta name="description" content="CryoLedger provides end-to-end supply chain assurance with GPS verification and cryptographic checks.">
    <meta property="og:title" content="CryoLedger - Supply Chain Integrity">
    <meta property="og:description" content="Secure Product Authentication System with Geo-Verification.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cryoledger-backend.onrender.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CryoLedger">
    <meta name="twitter:description" content="Protecting trust through location-intelligent product authentication.">

<link rel="canonical" href="https://cryoledger-backend.onrender.com/admin.html">

    <link rel="stylesheet" href="styles.css">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/icons/icon.svg">
</head>

<body>
  <!-- CryoLedger Global Splash Screen -->
  <div id="cryo-global-splash" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0B1120; z-index:9999999; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.8s ease, visibility 0.8s ease;">
    <style>
      @keyframes cryoSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .cryo-spinner { width: 48px; height: 48px; border: 4px solid rgba(16,185,129,0.2); border-left-color: #10b981; border-radius: 50%; animation: cryoSpin 1s linear infinite; margin-top: 2rem; margin-bottom: 2rem; }
      .cryo-logo-text { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, #fff 30%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Outfit', sans-serif; display:flex; align-items:center; gap:0.5rem;}
      @media(max-width: 600px) {
         .cryo-logo-text { font-size: 2.2rem; }
         .cryo-splash-msg { font-size: 0.95rem; text-align: center; padding: 0 1rem; }
      }
    </style>
    <div class="cryo-logo-text">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      CryoLedger
    </div>
    <div class="cryo-spinner"></div>
    <div class="cryo-splash-msg" style="color: #94a3b8; font-family: 'Inter', sans-serif; font-weight: 500;">Please wait while the application is loading...</div>
  </div>
  <script>
    (function(){
      let isReady = false;
      let isWindowLoaded = false;
      
      const checkReady = () => {
        if(isReady && isWindowLoaded) {
          const splash = document.getElementById('cryo-global-splash');
          if(splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => splash.remove(), 800);
          }
        }
      };

      window.addEventListener('load', () => {
        isWindowLoaded = true;
        checkReady();
      });

      const pingHealth = () => {
        fetch('/api/health')
          .then(res => {
            if(res.ok) {
              isReady = true;
              checkReady();
            } else {
              setTimeout(pingHealth, 1000);
            }
          })
          .catch(() => {
            setTimeout(pingHealth, 1000);
          });
      };
      
      pingHealth();
      
      // Complete fallback in case there is no connection for 30s
      setTimeout(() => {
         if(!isReady) {
            isReady = true;
            checkReady();
         }
      }, 30000);
    })();
  </script>


    <div class="container">
        <div
            style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h2 style="font-size: 2rem; font-weight: 700;">Admin Request Console</h2>
                <p style="color: var(--color-secondary);">Review, approve, or reject administrative location bypass
                    requests.</p>
            </div>
            <div>
                <button type="button" class="btn btn-secondary" id="btn-refresh" style="font-size: 0.9rem;">
                    🔄 Refresh Table
                </button>
            </div>
        </div>

        <!-- Alert Container -->
        <div id="alert-container"></div>

        <!-- Filter Control Card -->
        <div class="card" style="margin-bottom: 2rem; padding: 1.25rem 2rem;">
            <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 200px;">
                    <label for="filter-prod-id">Filter by Product ID</label>
                    <input type="text" id="filter-prod-id" placeholder="Start typing ID...">
                </div>
                <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 150px;">
                    <label for="filter-status">Filter by Status</label>
                    <select id="filter-status">
                        <option value="ALL">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Request Listing Tables -->
        <div class="table-wrapper">
            <div class="table-responsive"><table>
                <thead>
                    <tr>
                        <th>Product Info</th>
                        <th>Verifier Location</th>
                        <th>Coordinates</th>
                        <th>Requested Date</th>
                        <th>Bypass Status</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="requests-table-body">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--color-secondary); padding: 3rem;">
                            Loading bypass requests from server...
                        </td>
                    </tr>
                </tbody>
            </table></div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/admin.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
</body>

</html>
