<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryoLedger - Reset Security Credentials</title>

    <meta name="description" content="CryoLedger provides end-to-end supply chain assurance with GPS verification and cryptographic checks.">
    <meta property="og:title" content="CryoLedger - Supply Chain Integrity">
    <meta property="og:description" content="Secure Product Authentication System with Geo-Verification.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cryoledger-backend.onrender.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CryoLedger">
    <meta name="twitter:description" content="Protecting trust through location-intelligent product authentication.">

<link rel="canonical" href="https://cryoledger-backend.onrender.com/reset-password.html">

    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            max-width: 460px;
            width: 100%;
            margin: 4rem auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 5;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-title h2 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .auth-title p {
            color: var(--color-secondary);
            font-size: 0.95rem;
        }

        .glass-portal-card {
            background: rgba(19, 28, 49, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            transition: var(--transition);
        }

        .glass-portal-card:hover {
            border-color: rgba(16, 185, 129, 0.25);
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--color-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            user-select: none;
            padding: 4px 6px;
            transition: var(--transition);
        }

        .password-toggle-btn:hover {
            color: var(--accent);
        }

        .btn-loading-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner-loader {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/icons/icon.svg">
</head>

<body>

    <!-- Animated Particle Background Canvas -->
    <canvas id="canvas-bg"
        style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1; pointer-events:none;"></canvas>

    <div class="container">
        <div class="auth-container">

            <div class="auth-title">
                <h2>Security Reset</h2>
                <p>Change and verify your ledger security login password.</p>
            </div>

            <div class="glass-portal-card">
                <div id="alert-container"></div>

                <!-- Reset Form -->
                <form id="form-reset" onsubmit="handleResetSubmit(event)">
                    <div class="form-group">
                        <label for="reset-password">New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="reset-password" placeholder="Choose a strong password"
                                oninput="checkPasswordStrength(this.value)" required>
                            <button type="button" class="password-toggle-btn"
                                onclick="togglePassView('reset-password', this)">SHOW</button>
                        </div>
                        <div id="password-strength-container" style="margin-top: 0.6rem; display: none;">
                            <div
                                style="height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; display: flex; gap: 2px;">
                                <div id="bar-1"
                                    style="flex:1; height: 100%; background: transparent; transition: var(--transition);">
                                </div>
                                <div id="bar-2"
                                    style="flex:1; height: 100%; background: transparent; transition: var(--transition);">
                                </div>
                                <div id="bar-3"
                                    style="flex:1; height: 100%; background: transparent; transition: var(--transition);">
                                </div>
                            </div>
                            <span id="password-strength-text"
                                style="font-size: 0.75rem; color: var(--color-secondary); margin-top: 0.35rem; display: inline-block; font-weight: 500;">Strength:
                                Weak</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="reset-confirm">Confirm Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="reset-confirm" placeholder="Repeat your password" required>
                            <button type="button" class="password-toggle-btn"
                                onclick="togglePassView('reset-confirm', this)">SHOW</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-reset-submit"
                        style="width: 100%; padding: 1rem;">
                        <span class="btn-loading-wrapper" id="reset-btn-content">🔒 Update Credentials</span>
                    </button>
                </form>

                <div style="text-align: center; margin-top: 2rem;">
                    <a href="login.html"
                        style="color: var(--color-secondary); text-decoration: none; font-size: 0.9rem;">
                        &larr; Back to Login Page
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script src="js/utils.js"></script>
    <script>
        createHeader();
        createFooter();

        // Canvas Particle Background
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 45; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                radius: Math.random() * 2 + 1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(16, 185, 129, 0.08)';
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.03)';
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        function togglePassView(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'HIDE';
            } else {
                input.type = 'password';
                btn.textContent = 'SHOW';
            }
        }

        function checkPasswordStrength(password) {
            const container = document.getElementById('password-strength-container');
            const b1 = document.getElementById('bar-1');
            const b2 = document.getElementById('bar-2');
            const b3 = document.getElementById('bar-3');
            const txt = document.getElementById('password-strength-text');

            if (!password) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';

            let score = 0;
            if (password.length >= 8) score++;
            if (/[a-zA-Z]/.test(password) && /[0-9]/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;

            b1.style.background = 'transparent';
            b2.style.background = 'transparent';
            b3.style.background = 'transparent';

            if (score === 1) {
                b1.style.background = '#ef4444';
                txt.textContent = 'Strength: Weak (Add letters, numbers, and symbols)';
                txt.style.color = '#ef4444';
            } else if (score === 2) {
                b1.style.background = '#fbbf24';
                b2.style.background = '#fbbf24';
                txt.textContent = 'Strength: Medium (Add special symbols)';
                txt.style.color = '#fbbf24';
            } else if (score === 3) {
                b1.style.background = '#10b981';
                b2.style.background = '#10b981';
                b3.style.background = '#10b981';
                txt.textContent = 'Strength: Strong';
                txt.style.color = '#10b981';
            }
        }

        // Handle submission
        async function handleResetSubmit(event) {
            event.preventDefault();
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = '';

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                showAlert("Reset token is missing from the request URL path.", "error");
                return;
            }

            const p1 = document.getElementById('reset-password').value;
            const p2 = document.getElementById('reset-confirm').value;

            if (p1 !== p2) {
                showAlert("Passwords do not match.", "error");
                return;
            }

            if (p1.length < 8) {
                showAlert("Password must be at least 8 characters long.", "error");
                return;
            }

            const btn = document.getElementById('btn-reset-submit');
            const btnContent = document.getElementById('reset-btn-content');

            btn.disabled = true;
            btnContent.innerHTML = '<div class="spinner-loader"></div> Updating...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: p1 })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showAlert("Password reset successful! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2500);
                } else {
                    showAlert(data.message || "Failed to reset password credentials.", "error");
                }
            } catch (err) {
                showAlert("Network connection error.", "error");
            } finally {
                btn.disabled = false;
                btnContent.innerHTML = '🔒 Update Credentials';
            }
        }
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
</body>

</html>
